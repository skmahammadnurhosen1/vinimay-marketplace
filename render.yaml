# ==============================================================================
# Render Blueprint Specification — AutoPartsHub / Vinimay Backend Web Service
# ==============================================================================
services:
  - type: web
    name: autopartshub-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://vinimay-p2p-marketplace.web.app
      - key: FIREBASE_PROJECT_ID
        value: vinimay-p2p-marketplace
      - key: FIREBASE_STORAGE_BUCKET
        value: vinimay-p2p-marketplace.appspot.com
      - key: LOG_LEVEL
        value: info
